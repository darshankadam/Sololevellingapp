<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Solo Leveling Gym — The System</title>
  <meta name="description" content="A local, offline PPL workout tracker with Solo Leveling style progression. All data stays on your device.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#05080f">

  <!-- iOS add-to-home-screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The System">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- Fonts (fall back to system fonts offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-palette="#38bdf8,#a78bfa,#2dd4bf">

  <div id="app">
    <header class="appbar">
      <svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="lgMark" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#38bdf8"/><stop offset=".55" stop-color="#7c93f5"/><stop offset="1" stop-color="#a855f7"/>
          </linearGradient>
          <filter id="lgGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#6aa8ff" flood-opacity=".85"/>
          </filter>
        </defs>
        <g filter="url(#lgGlow)" stroke-linejoin="round">
          <path d="M24 3 42 13.5V34.5L24 45 6 34.5V13.5Z" fill="url(#lgMark)" fill-opacity=".10" stroke="url(#lgMark)" stroke-width="2.2"/>
          <path d="M24 6.8 38.8 15.4V32.6L24 41.2 9.2 32.6V15.4Z" fill="none" stroke="url(#lgMark)" stroke-width=".8" opacity=".4"/>
          <path d="M20.5 11.6 24 8.1 27.5 11.6" fill="none" stroke="url(#lgMark)" stroke-width="1.8" stroke-linecap="round"/>
          <g fill="url(#lgMark)">
            <rect x="18" y="22.2" width="12" height="3.6" rx="1.8"/>
            <rect x="14.4" y="18.4" width="3.6" height="11.2" rx="1.6"/>
            <rect x="30" y="18.4" width="3.6" height="11.2" rx="1.6"/>
            <rect x="11.4" y="20.4" width="2.6" height="7.2" rx="1.3"/>
            <rect x="34" y="20.4" width="2.6" height="7.2" rx="1.3"/>
          </g>
        </g>
      </svg>
      <h1>THE <b>SYSTEM</b></h1>
      <span class="sub" id="appDate"></span>
    </header>

    <main id="view"><!-- views render here --></main>
  </div>

  <nav id="nav">
    <button data-nav="home"><span class="ic">⬡</span>System</button>
    <button data-nav="log"><span class="ic">⚔</span>Log</button>
    <button data-nav="stats"><span class="ic">📈</span>Stats</button>
    <button data-nav="data"><span class="ic">⬢</span>Data</button>
  </nav>

  <!-- Spreadsheet engine (vendored, offline) -->
  <script defer src="vendor/xlsx.full.min.js"></script>
  <!-- App -->
  <script type="module" src="js/app.js"></script>
  <script>
    // small header date; harmless if module loads later
    (function () {
      var d = new Date();
      var el = document.getElementById('appDate');
      if (el) el.textContent = d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();
    })();
  </script>
</body>
</html>
